    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # UI
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  data_table_2: ^2.5.14
  dropdown_search: ^5.0.6
  file_selector: ^0.9.0

  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  pdf: ^3.11.1
  printing: ^5.13.1
  excel: ^4.0.6
  path_provider: ^2.1.4
  open_file: ^3.5.8
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  local_auth: ^2.3.0
  flutter_local_notifications: ^17.2.3
  uuid: ^4.5.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  encrypt: ^5.0.3
  # pinput removed: not used in app and breaks Android build
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  timeago: ^3.7.0
  badges: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  percent_indicator: ^4.2.3
  syncfusion_flutter_charts: ^27.1.48
  month_picker_dialog: ^4.0.0
  http: ^1.6.0
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
