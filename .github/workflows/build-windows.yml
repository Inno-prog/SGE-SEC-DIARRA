name: Build Windows Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Clean build cache
        run: flutter clean

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package installer with NSIS
        run: |
          choco install nsis -y --no-progress
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          $exe = Get-ChildItem -Recurse build\windows\x64\ -Filter *.exe | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Found EXE: $exe"
          $script = @"
          OutFile "sge_secdiarra-installer.exe"
          InstallDir "`$PROGRAMFILES\SGE Secdiarra"
          Page directory
          Page instfiles
          Section "Install"
            SetOutPath "`$INSTDIR"
            File "$exe"
            CreateShortCut "`$DESKTOP\SGE Secdiarra.lnk" "`$INSTDIR\$(basename "$exe")"
          SectionEnd
          "@
          Set-Content -Path installer.nsi -Value $script
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: sge_secdiarra-windows-installer
          path: sge_secdiarra-installer.exe
          retention-days: 14
