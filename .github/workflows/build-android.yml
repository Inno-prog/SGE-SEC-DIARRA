name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Create release keystore for CI
        run: |
          keytool -genkeypair -v -keystore upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass sge_secdiarra -keypass sge_secdiarra -dname "CN=sge_secdiarra, OU=sge_secdiarra, O=sge_secdiarra, L=sge_secdiarra, ST=BF, C=BF"

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sge-secdiarra-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
