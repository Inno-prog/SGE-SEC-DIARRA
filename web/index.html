<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Système de Gestion des Employés - Cabinet Secdiarra">

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#8B0000">
  <meta name="application-name" content="SGE Secdiarra">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SGE Secdiarra">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SGE Secdiarra</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8F9FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #pwa-splash {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #F8F9FA 0%, #ECEFF1 100%);
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(139, 0, 0, 0.2);
      margin-bottom: 24px;
      animation: pulse 2s infinite ease-in-out;
    }
    .splash-title {
      font-size: 22px;
      font-weight: 700;
      color: #8B0000;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
    }
    .splash-subtitle {
      font-size: 13px;
      color: #616161;
      margin: 0 0 28px 0;
    }
    .splash-spinner {
      width: 32px;
      height: 32px;
      border: 3.5px solid rgba(139, 0, 0, 0.15);
      border-top-color: #8B0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body>
  <!-- PWA Splash Screen visible pendant le chargement du moteur Flutter -->
  <div id="pwa-splash">
    <img src="icons/Icon-192.png" alt="SGE Secdiarra" class="splash-logo">
    <h1 class="splash-title">SGE SEC DIARRA</h1>
    <p class="splash-subtitle">Système de Gestion des Employés</p>
    <div class="splash-spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
